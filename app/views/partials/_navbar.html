<div class="navbar-user-actions">
    <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Alternar Tema">☀️</button>

    <a href="{{ url_for('profile.index') }}" class="user-profile-badge">
        <div class="user-avatar">
            {{ session.get('user_name', 'U')[:1] | upper }}
        </div>
        <div class="user-meta-info">
            <div class="user-meta-name">{{ session.get('user_name', 'Usuário') }}</div>
            <span class="role-badge role-{{ session.get('user_role', 'operator') }}">
                {{ session.get('user_role', 'operator') | upper }}
            </span>
        </div>
    </a>
</div>
