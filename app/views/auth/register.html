{% extends 'layouts/base.html' %}
{% block title %}Cadastrar Loja - Stoppa Core{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand-logo-box">
                    <img src="{{ url_for('static', filename='img/brand/stoppacore-dark-V.png') }}" 
                         alt="Stoppa Core" 
                         class="auth-brand-img brand-dark-only">
                    <img src="{{ url_for('static', filename='img/brand/stoppacore-light-V.png') }}" 
                         alt="Stoppa Core" 
                         class="auth-brand-img brand-light-only">
                </div>
                <h1 class="auth-title">Criar Conta da Loja</h1>
                <p class="auth-subtitle">Registe a sua loja e centralize a operação do seu e-commerce.</p>
            </div>

            {% include 'partials/_alerts.html' %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label for="store_name">Nome da Loja *</label>
                    <input type="text" id="store_name" name="store_name" class="form-control" placeholder="Ex: Minha Loja Matriz" required autofocus>
                </div>

                <div class="form-group">
                    <label for="name">Seu Nome Completo *</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Ex: João da Silva" required>
                </div>

                <div class="form-group">
                    <label for="email">Seu E-mail *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="joao@loja.com" required>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="password">Senha *</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 dígitos" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirmar Senha *</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repita a senha" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-100 mb-2">Concluir Cadastro</button>
            </form>

            <div class="auth-footer">
                Já possui acesso? <a href="{{ url_for('auth.login') }}">Fazer Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
