{% extends "layouts/base.html" %}

{% block title %}Login - Shopee Gestor{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h1>Shopee Hub</h1>
        <p>Acesse o painel para gerenciar suas vendas</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="admin@shopee.com" required>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="******" required>
        </div>

        <button type="submit" class="btn-primary">Entrar na Conta</button>
    </form>

    <div class="auth-footer">
        Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a>
    </div>
</div>
{% endblock %}
