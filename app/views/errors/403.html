{% extends 'layouts/base.html' %}
{% block title %}Acesso Negado (403){% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container text-center">
        <div class="auth-card">
            <div class="empty-state-icon text-danger" style="font-size: 3.5rem;">🔒</div>
            <h1 class="mb-1">Acesso Restrito</h1>
            <p class="mb-3 text-muted">Seu cargo de usuário não possui permissão para acessar esta área ou executar esta ação.</p>
            <a href="{{ url_for('main.welcome') }}" class="btn-primary w-100">Voltar ao Início</a>
        </div>
    </div>
</div>
{% endblock %}
