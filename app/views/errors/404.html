{% extends 'layouts/base.html' %}
{% block title %}Página Não Encontrada (404){% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container" style="max-width: 500px;">
        <div class="auth-card text-center" style="padding: 2.75rem 2rem;">
            <div class="error-icon-badge error-badge-warning">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                    <path d="M9 11h4"></path>
                </svg>
            </div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--text-main);">Página Não Encontrada</h1>
            <p class="text-muted" style="margin-bottom: 1.75rem; line-height: 1.5; font-size: 0.95rem;">
                O endereço que você tentou acessar não existe ou foi movido.
            </p>
            <a href="{{ url_for('main.welcome') }}" class="btn-primary" style="display: inline-block; padding: 0.75rem 1.5rem; text-decoration: none;">
                Voltar ao Início
            </a>
        </div>
    </div>
</div>
{% endblock %}
