<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Painel{% endblock %} - Shopee Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/catalog.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        {% include 'partials/_sidebar.html' %}

        <div class="main-content">
            <header class="top-navbar">
                <div class="navbar-left">
                    <button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir Menu">☰</button>
                    <h1 class="page-title">{% block page_title %}Painel de Controle{% endblock %}</h1>
                </div>

                {% include 'partials/_navbar.html' %}
            </header>

            <main class="content-body">
                {% include 'partials/_alerts.html' %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/masks.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
